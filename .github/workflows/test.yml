name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Node ${{ matrix.node }}${{ matrix.os == 'ubuntu-latest' && '' || format(' / {0}', matrix.os) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
        os: [ubuntu-latest]
        include:
          - node: 22
            os: windows-latest
          - node: 22
            os: macos-latest

    steps:
      # Check out the gateway into a subdirectory so we can also clone the
      # sibling axis-protocol-sdk and have file:../axis-protocol-sdk resolve.
      # Once the SDK ships on npm and gateway's package.json switches to a
      # versioned dep, this dance goes away — checkout to ./ and run `npm ci`.
      - name: Checkout gateway
        uses: actions/checkout@v4
        with:
          path: axis-gateway

      - name: Checkout axis-protocol-sdk (sibling)
        uses: actions/checkout@v4
        with:
          repository: MachinesOfDesire/axis-protocol-sdk
          path: axis-protocol-sdk

      - name: Use Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install deps
        working-directory: axis-gateway
        run: npm install

      - name: Run tests
        working-directory: axis-gateway
        run: npm test
